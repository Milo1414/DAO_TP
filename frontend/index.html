<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Red de préstamos interbibliotecarios</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="marca">
            <span class="marca-icono" aria-hidden="true">B</span>
            <div>
                <h1>Biblioteca</h1>
                <p>Red de préstamos interbibliotecarios</p>
            </div>
        </div>
        <div class="sesion-personal" id="sesion-personal" hidden>
            <span id="nombre-personal"></span>
            <button type="button" class="boton secundario pequeno" data-accion="cerrar-sesion">Cerrar sesión</button>
        </div>
        <div class="estado-servidor" id="estado-servidor" title="Estado de la API">
            <span class="punto"></span>
            <span id="estado-servidor-texto">Conectando...</span>
        </div>
    </header>

    <section id="acceso" class="acceso" aria-label="Acceso del personal">
        <p class="cargando">Comprobando sesión...</p>
    </section>

    <div class="diseno" id="sistema" hidden>
        <nav class="menu" aria-label="Secciones">
            <button type="button" data-seccion="inicio" class="activo">Inicio</button>

            <span class="menu-grupo">Administración</span>
            <button type="button" data-seccion="sedes">Sedes</button>
            <button type="button" data-seccion="socios">Socios</button>
            <button type="button" data-seccion="catalogo">Catálogo y ejemplares</button>
            <button type="button" data-seccion="usuarios">Usuarios</button>

            <span class="menu-grupo">Circulación</span>
            <button type="button" data-seccion="solicitudes">Solicitudes <span class="contador" data-contador="solicitudes" hidden></span></button>
            <button type="button" data-seccion="reservas">Reservas <span class="contador" data-contador="reservas" hidden></span></button>
            <button type="button" data-seccion="prestamos">Préstamos y devoluciones <span class="contador" data-contador="prestamos" hidden></span></button>

            <span class="menu-grupo">Logística</span>
            <button type="button" data-seccion="remitos">Remitos e historial <span class="contador" data-contador="remitos" hidden></span></button>

            <span class="menu-grupo">Análisis</span>
            <button type="button" data-seccion="reportes">Reportes</button>
        </nav>

        <main id="contenido" class="contenido">
            <p class="cargando">Cargando datos...</p>
        </main>
    </div>

    <div id="mensajes" class="mensajes" aria-live="polite"></div>
    <script src="/app.js"></script>
</body>
</html>
